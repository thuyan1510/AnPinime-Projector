name: Build Projector APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*universal*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1); fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" AnPinime-K670Pro.apk
          ls -lh AnPinime-K670Pro.apk

          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | awk '{print $3}')
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo "Building OTA metadata: Code $VERSION_CODE, Name $VERSION_NAME"
          cat <<EOF > version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/thuyan1510/anpinime-dl/releases/download/latest/AnPinime-K670Pro.apk",
            "changelog": "Bản cập nhật tự động v$VERSION_NAME: Tối ưu siêu nhẹ 9.7MB, hỗ trợ D-Pad remote và âm thanh FFmpeg."
          }
          EOF
          cat version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnPinime-K670Pro-APK
          path: |
            AnPinime-K670Pro.apk
            version.json
          if-no-files-found: error

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AnPinime TV Projector (Onikuma K670 Pro)"
          files: |
            AnPinime-K670Pro.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
